<div class="zwrap">


<div class="ztop">
  <h1>Zoom notes</h1><span class="sub">What other people said, and what you owe them</span>
  <span class="meta">43 meetings &middot; synced 2 min ago</span>
  <button class="btn" data-action="zoom-refresh">Refresh</button><button class="btn pri" data-action="zoom-add">+ Add note</button>
</div>

<div class="card bar">
  <input class="search" data-action="zoom-search" placeholder="Search a person, company or something they said">
  <div class="chips"><button class="chip on" data-action="zoom-filter" data-filter="all">All</button><button class="chip" data-action="zoom-filter" data-filter="investors">Investors</button><button class="chip" data-action="zoom-filter" data-filter="speer">Speer</button><button class="chip" data-action="zoom-filter" data-filter="design">Design partners</button><button class="chip" data-action="zoom-filter" data-filter="team">Team</button><button class="chip" data-action="zoom-filter" data-filter="solo">Solo</button></div>
  <div class="seg"><span class="on" data-action="zoom-src" data-src="all">All</span><span data-action="zoom-src" data-src="zoom">Zoom</span></div>
  <div class="seg"><span class="on" data-action="zoom-sort" data-sort="newest">Newest</span><span data-action="zoom-sort" data-sort="oldest">Oldest</span></div>
</div>

<div id="boxes"></div>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer"><span class="grab" id="grab"></span><div class="x"><button class="btn sm" id="close" data-action="zoom-close">Close &times;</button></div><div class="rd" id="rd"></div></div>
<div class="toast" id="toast"></div>
