<section id="pg-contacts" class="reach-lists">
 <div class="bar"><h1>Contacts</h1><span class="sub">your lists · synced with GoHighLevel</span>
  <div class="r"><div class="seg" id="cseg"><span data-v="contacts">Contacts</span><span class="on" data-v="lists">Lists</span></div><input class="search" id="lsearch" placeholder="Search this list" aria-label="Search this list"></div></div>
 <div class="lists">
  <div class="ll"><h6>LISTS</h6><div id="listnav"></div><button type="button" class="up" id="uploadList">+ Upload a list (CSV)</button></div>
  <div class="tbl">
   <div class="hd"><h3 id="lname"></h3><span id="lstat"></span>
    <select id="lsel" aria-label="Switch list"></select></div>
   <table><thead><tr><th>PERSON</th><th>PHONE</th><th>EMAIL</th><th>NOTES</th><th>STAGE</th><th>LAST TOUCH</th></tr></thead>
   <tbody id="lbody"></tbody></table>
  </div>
 </div>
 <div class="pop" id="pop"><div class="box">
  <h4 id="pn"></h4><div class="meta" id="pm"></div>
  <div class="row" id="pc"></div>
  <div class="nb" id="pnotes"></div>
  <div class="acts">
   <button type="button" class="btn p" id="popen">Open space</button>
   <button type="button" class="btn" id="pmark">Mark called</button>
   <button type="button" class="btn" id="px">Close</button>
  </div>
 </div></div>
 <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
 <div class="toast" id="toast"><span id="tmsg"></span><b id="tundo" style="display:none"></b></div>
 <div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
</section>
