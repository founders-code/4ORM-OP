<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Bruce, 4orm Finance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--line:#dfe4ee;--ink:#0d1526;--ink2:#3b4660;--ink3:#66718a;--blue:#2E6BF2;--blue50:#eaf1ff;--green:#11845b;--green50:#e5f6ee;--amber:#9a6200;--amber50:#fff4dc;--red:#b4233a;--red50:#fdecef}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 18px/1.5 Inter,system-ui,sans-serif}
button,input,select,textarea{font-family:inherit}
.review{background:#0d1526;color:#dfe6f7;font-size:14px;padding:8px 24px;display:flex;gap:16px;align-items:center}.review b{color:#fff}.review a{color:#9db9ff;margin-left:auto}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:12px 24px;flex-wrap:wrap}
.top img{height:40px}
.top nav{display:flex;gap:6px;flex-wrap:wrap}
.top nav a{font-size:17px;font-weight:700;color:var(--ink2);text-decoration:none;padding:10px 16px;border-radius:10px}
.top nav a.on{background:var(--blue50);color:var(--blue)}
.top .me{margin-left:auto;display:flex;align-items:center;gap:12px;font-weight:700}
.av{width:44px;height:44px;border-radius:50%;background:#24304f;color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:1280px;margin:0 auto;padding:28px 24px 80px}
h1{font-size:38px;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em}
.lead{font-size:20px;color:var(--ink2);margin:0 0 26px}
.btn{font:800 17px Inter,system-ui,sans-serif;border-radius:12px;padding:13px 22px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.big{font-size:20px;padding:17px 28px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:15px;padding:8px 14px;border-radius:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
.k{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0 0 10px}
.pill{display:inline-block;font-size:15px;font-weight:800;border-radius:999px;padding:4px 12px;white-space:nowrap}
.ok{background:var(--green50);color:var(--green)}.warn{background:var(--amber50);color:var(--amber)}.bad{background:var(--red50);color:var(--red)}.info{background:var(--blue50);color:var(--blue)}
.muted{color:var(--ink3)}
/* home */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:28px}
.tile{background:#fff;border:2px solid var(--line);border-radius:20px;padding:24px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;min-height:170px}
.tile:hover{border-color:var(--blue)}.tile b{font-size:26px}.tile span{color:var(--ink2);font-size:17px}.tile em{font-style:normal;margin-top:auto;font-weight:800;color:var(--blue)}
.tile.hero{background:var(--blue);border-color:var(--blue);color:#fff}.tile.hero span{color:#dbe6ff}.tile.hero em{color:#fff}
.row2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.li{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}.li b{flex:1}
.news a{color:var(--ink);text-decoration:none}.news a:hover{color:var(--blue)}.news small{display:block;color:var(--ink3);font-size:15px;font-weight:600}
/* contacts */
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:260px;font:500 19px Inter;padding:14px 18px;border:2px solid var(--line);border-radius:14px;background:#fff}
.search:focus,.field:focus,textarea:focus,input:focus,select:focus{outline:none;border-color:var(--blue)}
table.t{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.t th,.t td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);font-size:17px;vertical-align:middle}
.t th{font-size:13px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;background:#fafbfd}
.t td small{display:block;color:var(--ink3);font-size:14px}
.star{font:800 14px Inter;border:2px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff;color:var(--ink3);cursor:pointer;white-space:nowrap}
.star.on{background:var(--amber50);border-color:#e9b949;color:var(--amber)}
.empty{text-align:center;padding:50px 20px;color:var(--ink2)}
/* upload */
.steps{display:flex;gap:10px;margin:0 0 22px;flex-wrap:wrap}.steps div{flex:1;min-width:200px;border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:800;color:var(--ink3);background:#fff}
.steps div.done{border-color:var(--green);color:var(--green)}.steps div.on{border-color:var(--blue);color:var(--blue);background:var(--blue50)}
.drop{border:3px dashed #b9c4da;border-radius:20px;background:#fff;padding:60px 20px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--blue);background:var(--blue50)}
.drop b{font-size:26px;display:block;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:18px;align-items:start}
.map td{font-size:17px}
select.sel{font:600 17px Inter;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;min-width:210px}
.sum div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:18px}.sum b{font-size:22px}
.field{font:500 18px Inter;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;width:100%}
/* lists */
.grid4{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}.chip{font:700 16px Inter;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.bar2{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:17px;color:var(--ink2);flex-wrap:wrap}
.p{display:grid;grid-template-columns:32px 1fr auto auto;gap:14px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.box{width:28px;height:28px;border:2px solid var(--ink3);border-radius:8px;background:#fff}.box.on{background:var(--blue);border-color:var(--blue);box-shadow:inset 0 0 0 4px #fff}
.p b{font-size:19px}.p small{display:block;color:var(--ink3);font-size:15px}
.when{font-size:15px;color:var(--ink3);white-space:nowrap}
.cnt{font-size:56px;font-weight:800;line-height:1;margin:14px 0 2px}
.side ul{list-style:none;padding:0;margin:12px 0;max-height:240px;overflow:auto}.side li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:17px}.side li span{color:var(--amber);font-weight:800;font-size:13px}
.saved div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.saved b{font-size:18px}
.saved .x{font:700 13px Inter;color:var(--ink3);border:0;background:none;cursor:pointer;padding:4px}
/* email */
.grid3{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:start}
label.l{display:block;font-size:14px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
textarea.field{min-height:260px;line-height:1.6;resize:vertical}
.ins{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ins button{font:700 15px Inter;border:2px dashed var(--line);border-radius:10px;background:#fff;padding:8px 12px;color:var(--ink2);cursor:pointer}
.mail{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;font-size:16px;line-height:1.55;overflow:auto}
.mail .h{font-size:15px;color:var(--ink3);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.chk div{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:17px}.chk div:last-child{border:0}.chk b{flex:1;font-weight:600}
.send{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.hist div{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.hist b{flex:1}
.prog{height:8px;background:#e6ebf4;border-radius:6px;overflow:hidden;min-width:120px;flex:1}.prog i{display:block;height:100%;background:var(--green)}
/* undo + toast */
#undo{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0d1526;color:#fff;border-radius:14px;padding:14px 16px 14px 22px;display:none;gap:16px;align-items:center;font-size:17px;font-weight:700;z-index:50;box-shadow:0 14px 40px rgba(13,21,38,.3)}
#undo button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:800 16px Inter;cursor:pointer}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:#0d1526;color:#fff;border-radius:12px;padding:12px 20px;font-weight:700;display:none;z-index:60;max-width:90vw}
.soon{text-align:center;padding:60px 24px}.soon b{font-size:28px;display:block;margin-bottom:8px}
/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,96vw);background:#fff;box-shadow:-24px 0 60px rgba(13,21,38,.22);transform:translateX(105%);transition:transform .2s;z-index:40;overflow:auto;padding:24px 26px 60px}
#drawer.on{transform:none}#scrim{position:fixed;inset:0;background:rgba(13,21,38,.32);z-index:39;display:none}#scrim.on{display:block}
#drawer h2{font-size:30px;margin:0 0 4px}.dg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dg label{font-size:13px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.dg input{width:100%}.hrow{padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}.hrow small{display:block;color:var(--ink3);font-size:13px}
/* pipeline */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{flex:0 0 270px;background:#e9edf5;border-radius:16px;padding:12px;min-height:220px}
.col.over{outline:3px dashed var(--blue);outline-offset:-3px}
.col h3{margin:2px 4px 10px;font-size:18px;display:flex;justify-content:space-between;align-items:center}.col h3 span{font-size:14px;color:var(--ink3)}
.pc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:grab;box-shadow:0 1px 0 rgba(13,21,38,.04)}
.pc b{font-size:17px;display:block}.pc small{display:block;color:var(--ink3);font-size:14px}.pc .due{font-size:13px;font-weight:800;margin-top:6px}.pc.imp{border-left:5px solid #e9b949}
.pc.dragging{opacity:.4}.late{color:var(--red)}.soon2{color:var(--green)}
.stg{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;margin-bottom:8px}
/* spaces */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.sc{background:#fff;border:2px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;text-decoration:none;color:var(--ink);display:flex;flex-direction:column}
.sc:hover{border-color:var(--blue)}.sc .cv{height:96px;background:linear-gradient(140deg,#2E6BF2,#0b2a6b);color:#fff;padding:14px 16px;display:flex;align-items:flex-end;font-size:21px;font-weight:800;line-height:1.15}
.sc .bd{padding:12px 16px 16px;font-size:15px;color:var(--ink2)}.sc .bd b{color:var(--ink)}
.flist div{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.flist a{color:var(--blue);font-weight:700;text-decoration:none;flex:1}.flist small{color:var(--ink3)}
@media(max-width:1000px){.tiles{grid-template-columns:1fr 1fr}.row2,.grid2,.grid3,.grid4{grid-template-columns:1fr}}
@media(max-width:620px){.tiles{grid-template-columns:1fr}.top nav a{padding:8px 10px;font-size:16px}h1{font-size:30px}}
</style>
</head>
<body>
<div class="review"><b>Review build.</b> This is Bruce's workspace as he will see it. It uses your sign-in for now; his own login comes after you approve. <a href="/planner">Back to Ops</a></div>
<header class="top"><div class="in"><img src="/assets/email/4orm-finance.png" alt="4orm Finance">
<nav id="nav"></nav>
<div class="me"><span>Bruce Fair</span><span class="av"><img src="/assets/email/bruce-photo.png" alt=""></span></div></div></header>
<main class="wrap" id="main"><div class="empty">Loading...</div></main>
<div id="scrim"></div><aside id="drawer" aria-label="Contact"></aside>
<div id="undo"><span id="undoT"></span><button type="button" id="undoB">Undo</button></div>
<div id="toast"></div>
<input type="file" id="file" accept=".csv,.xlsx,.xls,.tsv,text/csv" hidden>
<script>
(function () {
  var S = { contacts: [], lists: [], sends: [], settings: {}, news: [], loaded: false, q: '', lq: '', chips: {}, picked: {}, listName: '', listId: '', imp: null, email: { listId: '', subject: '4orm Helps', body: '', spaceId: '' }, testedHash: '', stages: [], spaces: [], editStages: null, open: '' };
  var NAV = [['home', 'Home'], ['news', 'News'], ['contacts', 'Contacts'], ['lists', 'Lists'], ['email', 'Email a list'], ['spaces', 'Spaces'], ['pipeline', 'Pipeline']];
  var $ = function (id) { return document.getElementById(id); };
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  /* Sign-in stays alive the same way Ops does it: Clerk issues a fresh token for every call. */
  function clerkHost(key) { var raw = String(key || '').replace(/^pk_(test|live)_/, '').replace(/-/g, '+').replace(/_/g, '/'); while (raw.length % 4) raw += '='; var host = ''; try { host = atob(raw).replace(/\$$/, ''); } catch (e) { return ''; } return /^[A-Za-z0-9.-]+$/.test(host) && host.indexOf('..') < 0 ? host : ''; }
  var boot = fetch('/api/clerk-publishable-key', { credentials: 'include' }).then(function (r) { return r.ok ? r.json() : {}; }).then(function (d) {
    var key = d && d.publishableKey, host = clerkHost(key);
    if (!key || !host) return null;
    return new Promise(function (res, rej) { var sc = document.createElement('script'); sc.async = true; sc.crossOrigin = 'anonymous'; sc.src = 'https://' + host + '/npm/@clerk/clerk-js@5/dist/clerk.browser.js'; sc.setAttribute('data-clerk-publishable-key', key); sc.onload = function () { res(window.Clerk); }; sc.onerror = rej; document.head.appendChild(sc); })
      .then(function (C) { var c = typeof C === 'function' ? new C(key) : C; window.__clerk = c; return c.load ? c.load().then(function () { return c; }) : c; });
  }).catch(function () { return null; });
  function token(fresh) { return boot.then(function (c) { return c && c.session && c.session.getToken ? c.session.getToken(fresh ? { skipCache: true } : undefined).catch(function () { return null; }) : null; }); }
  function authed(url, opts) {
    opts = opts || {};
    function go(t) { var h = Object.assign({}, opts.headers || {}); if (t) h.Authorization = 'Bearer ' + t; return fetch(url, Object.assign({}, opts, { credentials: 'include', headers: h })); }
    return token(false).then(go).then(function (r) { return r.status === 401 ? token(true).then(function (t) { return t ? go(t) : r; }) : r; });
  }
  function api(body) {
    return authed('/api/bw', body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {})
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok && !j.note) throw new Error(j.error || 'Something went wrong'); j._ok = r.ok; return j; }); });
  }
  function toast(t) { var el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = 'none'; }, 4200); }
  function undoLater(label, commit, undo) {
    var el = $('undo'), left = 10;
    if (undoLater.cur) undoLater.cur(true);
    var done = false;
    function paint() { $('undoT').textContent = label + ' · ' + left + 's'; }
    paint(); el.style.display = 'flex';
    var iv = setInterval(function () { left--; if (left <= 0) finish(true); else paint(); }, 1000);
    function finish(go) { if (done) return; done = true; clearInterval(iv); el.style.display = 'none'; undoLater.cur = null; if (go) commit(); else if (undo) undo(); }
    undoLater.cur = finish;
    $('undoB').onclick = function () { finish(false); };
  }
  window.addEventListener('beforeunload', function (e) { if (undoLater.cur) { e.preventDefault(); e.returnValue = ''; } });
  function name(c) { return ((c.first || '') + ' ' + (c.last || '')).trim() || c.email || 'No name'; }
  function ago(iso) {
    if (!iso) return 'Never emailed';
    var d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
    return d <= 0 ? 'Emailed today' : d === 1 ? 'Emailed yesterday' : d < 14 ? 'Emailed ' + d + ' days ago' : d < 60 ? 'Emailed ' + Math.round(d / 7) + ' weeks ago' : 'Emailed ' + Math.round(d / 30) + ' months ago';
  }
  function byId(id) { return S.contacts.filter(function (c) { return c.id === id; })[0]; }
  function emailable(c) { return c && c.email && !c.unsubscribed && !c.bounced; }
  function load() {
    return api().then(function (d) { S.contacts = d.contacts || []; S.lists = d.lists || []; S.sends = d.sends || []; S.settings = d.settings || {}; S.testTo = d.testTo; S.stages = d.stages || []; S.spaces = d.spaces || []; S.loaded = true; route(); if (S.open && S.open !== '_pick') openContact(S.open, true); })
      .catch(function () { $('main').innerHTML = '<div class="empty">Could not load. Sign in to 4orm Ops in this browser, then refresh.</div>'; });
  }
  function navPaint(v) { $('nav').innerHTML = NAV.map(function (n) { return '<a href="#' + n[0] + '"' + (n[0] === v ? ' class="on"' : '') + '>' + n[1] + '</a>'; }).join(''); }
  function route() {
    var h = (location.hash || '#home').slice(1).split('/');
    var v = h[0] || 'home';
    navPaint(v === 'upload' ? 'contacts' : v);
    if (!S.loaded) return;
    window.scrollTo(0, 0);
    ({ home: home, news: news, contacts: contacts, upload: upload, lists: lists, email: email, spaces: spacesPage, pipeline: pipelinePage }[v] || home)(h[1]);
  }
  window.addEventListener('hashchange', route);

  /* ---------- Home ---------- */
  function home() {
    var nc = S.contacts.length, nl = S.lists.length, tested = S.sends.some(function (s) { return s.kind === 'test'; });
    var h = new Date().toLocaleString('en-CA', { timeZone: 'America/Vancouver', hour: 'numeric', hour12: false });
    var greet = +h < 12 ? 'Good morning' : +h < 18 ? 'Good afternoon' : 'Good evening';
    function step(n, done, label, href, btn) { return '<div class="li"><span class="pill ' + (done ? 'ok' : 'info') + '">' + (done ? 'Done' : 'Step ' + n) + '</span><b>' + label + '</b>' + (done ? '' : '<a class="btn' + (n === 1 || (n === 2 && nc) || (n === 3 && nl) ? ' pri' : '') + '" href="' + href + '">' + btn + '</a>') + '</div>'; }
    $('main').innerHTML = '<h1>' + greet + ', Bruce</h1><p class="lead">Everything you need is one click away. Nothing sends without you pressing Send.</p>'
      + '<div class="tiles">'
      + '<a class="tile hero" href="#email"><b>Email a list</b><span>Write once, send to everyone on a list, personal to each.</span><em>Start an email</em></a>'
      + '<a class="tile" href="#contacts"><b>Contacts</b><span>Everyone you know, in one place. ' + nc + ' so far.</span><em>' + (nc ? 'Open contacts' : 'Upload your spreadsheet') + '</em></a>'
      + '<a class="tile" href="#lists"><b>Lists</b><span>Groups you email together. ' + nl + ' saved.</span><em>Make a list</em></a>'
      + '<a class="tile" href="#pipeline"><b>Pipeline</b><span>Where each conversation stands. Drag a name to move it.</span><em>Open pipeline</em></a>'
      + '<a class="tile" href="#spaces"><b>Spaces</b><span>Packs to send: the deck, the overview, a short note.</span><em>Open spaces</em></a>'
      + '<a class="tile" href="#news"><b>News</b><span>What moved in Canadian finance this week, in plain words.</span><em>Read the news</em></a></div>'
      + '<div class="row2"><section class="card"><div class="k">Getting started</div>'
      + step(1, nc > 0, 'Upload your contacts spreadsheet', '#upload', 'Upload')
      + step(2, nl > 0, 'Make your first list', '#lists', 'Make a list')
      + step(3, tested, 'Send yourself a test email', '#email', 'Try it') + '</section>'
      + '<section class="card news"><div class="k">News, this week</div><div id="hn"><div class="muted">Loading...</div></div></section></div>';
    getNews(function () { var el = $('hn'); if (el) el.innerHTML = newsRows(4); });
  }
  function getNews(cb) {
    if (S.news.length) return cb();
    authed('/api/news').then(function (r) { return r.json(); }).then(function (d) { S.news = (d.items || []).filter(function (n) { return !n.hidden; }); cb(); }).catch(function () { cb(); });
  }
  function newsRows(n) {
    var rows = S.news.slice(0, n);
    if (!rows.length) return '<div class="muted">No news yet today.</div>';
    return rows.map(function (x) {
      var when = x.publishedAt || x.published_at || '';
      var d = when ? new Date(when).toLocaleDateString('en-CA', { timeZone: 'America/Vancouver', weekday: 'long' }) : '';

      $('drawer').innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center"><span class="k" style="margin:0">Add to the pipeline</span><button class="btn sm" id="dx">Close</button></div><h2>Who should go on?</h2>'
        + '<input class="search" id="pq" style="width:100%;margin:10px 0" placeholder="Search" value="' + esc(q) + '"><label class="l" style="margin-top:0">Put them in</label><select class="field" id="pst">' + S.stages.map(function (st) { return '<option' + (st === st0 ? ' selected' : '') + '>' + esc(st) + '</option>'; }).join('') + '</select>'
        + '<div style="margin-top:10px">' + (rows.map(function (c) { return '<div class="p" data-pp="' + c.id + '"><span class="box' + (picked[c.id] ? ' on' : '') + '"></span><div><b>' + esc(name(c)) + '</b><small>' + esc(c.company || c.email || '') + '</small></div><span></span><span></span></div>'; }).join('') || '<div class="muted" style="padding:14px 0">Nobody left to add. Everyone matching is already on the pipeline.</div>') + '</div>'
        + '<button class="btn pri big" id="pgo" style="width:100%;margin-top:16px">Add ' + n + ' ' + (n === 1 ? 'person' : 'people') + '</button>';
      $('dx').onclick = closeDrawer;
      var pq = $('pq'); pq.oninput = function () { var v = pq.value, p0 = pq.selectionStart; paint(v); var nn = $('pq'); nn.focus(); try { nn.setSelectionRange(p0, p0); } catch (e) {} };
      document.querySelectorAll('[data-pp]').forEach(function (r) { r.onclick = function () { var id = r.getAttribute('data-pp'); picked[id] = !picked[id]; paint($('pq').value); }; });
      $('pgo').onclick = function () {
        var st = $('pst').value, ids = Object.keys(picked).filter(function (k) { return picked[k]; });
        if (!ids.length) { toast('Tick at least one person'); return; }
        Promise.all(ids.map(function (id) { return saveField(byId(id), { stage: st }); })).then(function () { closeDrawer(); toast(ids.length + ' added to ' + st); pipelinePage(); });
      };
    }
    S.open = '_pick';
    paint('');
    $('drawer').classList.add('on'); $('scrim').classList.add('on');
  }
  function stageEditor() {
    var E = S.editStages;
    $('main').innerHTML = '<h1>Edit stages</h1><p class="lead">Rename, reorder, add or delete. People in a deleted stage move to the first stage.</p><section class="card" style="max-width:760px">'
      + E.map(function (x, i) { return '<div class="stg"><input class="field" data-sn="' + i + '" value="' + esc(x.name) + '"><button class="btn sm" data-up="' + i + '"' + (i ? '' : ' disabled') + '>Move up</button><button class="btn sm" data-dn="' + i + '"' + (i < E.length - 1 ? '' : ' disabled') + '>Move down</button><button class="btn sm" data-sd="' + i + '"' + (E.length > 1 ? '' : ' disabled') + '>Delete</button></div>'; }).join('')
      + '<button class="btn" id="sadd" style="margin-top:6px">+ Add a stage</button><div style="display:flex;gap:10px;margin-top:20px"><button class="btn" id="scan">Cancel</button><button class="btn pri big" id="ssave" style="flex:1">Save stages</button></div></section>';
    document.querySelectorAll('[data-sn]').forEach(function (i) { i.oninput = function () { E[+i.getAttribute('data-sn')].name = i.value; }; });
    document.querySelectorAll('[data-up]').forEach(function (b) { b.onclick = function () { var i = +b.getAttribute('data-up'); var t = E[i]; E[i] = E[i - 1]; E[i - 1] = t; stageEditor(); }; });
    document.querySelectorAll('[data-dn]').forEach(function (b) { b.onclick = function () { var i = +b.getAttribute('data-dn'); var t = E[i]; E[i] = E[i + 1]; E[i + 1] = t; stageEditor(); }; });
    document.querySelectorAll('[data-sd]').forEach(function (b) { b.onclick = function () { E.splice(+b.getAttribute('data-sd'), 1); stageEditor(); }; });
    $('sadd').onclick = function () { E.push({ name: 'New stage', was: '' }); stageEditor(); var ins = document.querySelectorAll('[data-sn]'); ins[ins.length - 1].select(); };
    $('scan').onclick = function () { S.editStages = null; pipelinePage(); };
    $('ssave').onclick = function () {
      var names = E.map(function (x) { return x.name.trim(); }).filter(Boolean);
      if (!names.length) { toast('Keep at least one stage'); return; }
      var moves = [];
      S.contacts.forEach(function (c) {
        if (!c.stage) return;
        var hit = E.filter(function (x) { return x.was === c.stage; })[0];
        var to = hit && hit.name.trim() ? hit.name.trim() : names[0];
        if (to !== c.stage) moves.push([c, to]);
      });
      api({ action: 'settings', settings: { stages: names } }).then(function () {
        S.stages = names; S.editStages = null;
        return Promise.all(moves.map(function (m) { return saveField(m[0], { stage: m[1] }); }));
      }).then(function () { toast('Stages saved'); pipelinePage(); }).catch(function () { toast('Could not save the stages'); });
    };
  }

  /* ---------- Spaces ---------- */
  var GROUPS = ['Investors', 'Partners', 'Firms', 'General'];
  function spacesPage(id) {
    if (id) return spaceDetail(id);
    var groups = GROUPS.concat(S.spaces.map(function (x) { return x.group; })).filter(function (g, i, a) { return g && a.indexOf(g) === i; });
    $('main').innerHTML = '<h1>Spaces</h1><p class="lead">Packs to send: the deck, the overview, a short note. Attach one to any group email.</p>'
      + '<div class="tools"><div id="snewbox"><button class="btn pri" id="snew">+ New space</button></div></div>'
      + (S.spaces.length ? groups.map(function (g) {
        var rows = S.spaces.filter(function (x) { return (x.group || 'General') === g; });
        if (!rows.length) return '';
        return '<h2 style="font-size:22px;margin:22px 0 12px">' + esc(g) + ' <span class="muted" style="font-size:16px">' + rows.length + '</span></h2><div class="sgrid">' + rows.map(function (x) {
          var n = x.files.length + x.links.length;
          return '<a class="sc" href="#spaces/' + x.id + '"><div class="cv">' + esc(x.name) + '</div><div class="bd"><b>' + n + ' document' + (n === 1 ? '' : 's') + '</b>' + (x.note ? '<div style="margin-top:4px">' + esc(x.note.slice(0, 90)) + (x.note.length > 90 ? '...' : '') + '</div>' : '') + '</div></a>';
        }).join('') + '</div>';
      }).join('') : '<div class="card empty"><b style="font-size:24px;display:block;margin-bottom:8px">No spaces yet</b>Make one for the investor pack: add the overview PDF and the deck link.</div>');
    $('snew').onclick = function () {
      $('snewbox').innerHTML = '<div style="display:flex;gap:10px;flex-wrap:wrap"><input class="field" id="snn" style="min-width:300px" placeholder="Name it, like Investor pack"><button class="btn pri" id="snok">Create</button></div>';
      $('snn').focus();
      var go = function () { var n = $('snn').value.trim(); if (!n) { $('snn').focus(); return; } api({ action: 'space-save', space: { name: n, group: 'Investors' } }).then(function (r) { return load().then(function () { location.hash = '#spaces/' + r.id; }); }); };
      $('snok').onclick = go; $('snn').onkeydown = function (e) { if (e.key === 'Enter') go(); };
    };
  }
  function spaceDetail(id) {
    var x = S.spaces.filter(function (y) { return y.id === id; })[0];
    if (!x) { $('main').innerHTML = '<div class="empty">That space is gone. <a href="#spaces">Back to Spaces</a></div>'; return; }
    var kb = function (n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; };
    $('main').innerHTML = '<a href="#spaces" class="btn sm" style="margin-bottom:14px">Back to Spaces</a>'
      + '<div class="grid2"><section class="card"><label class="l" style="margin-top:0">Name</label><input class="field" id="xn" style="font-size:22px;font-weight:800" value="' + esc(x.name) + '">'
      + '<label class="l">Group</label><select class="field" id="xg">' + GROUPS.map(function (g) { return '<option' + (g === x.group ? ' selected' : '') + '>' + g + '</option>'; }).join('') + '</select>'
      + '<label class="l">Short note to go with it</label><textarea class="field" id="xnote" style="min-height:120px" placeholder="What this pack is for, or a line you can paste into the email">' + esc(x.note) + '</textarea>'
      + '<div class="k" style="margin-top:22px">Documents</div><div class="flist">'
      + x.files.map(function (f) { return '<div><a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.name) + '</a><small>' + kb(f.size) + '</small><button class="star" data-frm="' + f.id + '">Remove</button></div>'; }).join('')
      + x.links.map(function (l, i) { return '<div><a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.name) + '</a><small>link</small><button class="star" data-lrm="' + i + '">Remove</button></div>'; }).join('')
      + ((x.files.length + x.links.length) ? '' : '<p class="muted">No documents yet.</p>') + '</div>'
      + '<div class="drop" id="xdrop" style="padding:30px 16px;margin-top:14px"><b style="font-size:20px">Drop a file here</b><span class="muted">or click to choose. PDF, Word, PowerPoint or images, up to 3 MB.</span></div>'
      + '<div style="display:grid;grid-template-columns:1fr 1.4fr auto;gap:10px;margin-top:12px"><input class="field" id="lname" placeholder="Link name, like The deck"><input class="field" id="lurl" placeholder="Paste a link: Drive, DocSend, website"><button class="btn" id="ladd">Add link</button></div>'
      + '</section><section><div class="card"><div class="k">Use it</div><p style="margin:0 0 14px;color:var(--ink2)">Attach this space to a group email. Each person gets the documents as links under your message.</p><button class="btn pri big" id="xmail" style="width:100%">Email a list with this space</button></div>'
      + '<div class="card" style="margin-top:16px"><button class="btn" id="xdel" style="width:100%">Delete this space</button></div></section></div>';
    var save = function (patch) { Object.assign(x, patch); return api({ action: 'space-save', space: { id: x.id, name: x.name, note: x.note, group: x.group, links: x.links } }); };
    $('xn').onchange = function () { save({ name: this.value.trim() || x.name }); };
    $('xg').onchange = function () { save({ group: this.value }); };
    $('xnote').onchange = function () { save({ note: this.value }); toast('Saved'); };
    $('ladd').onclick = function () {
      var u = $('lurl').value.trim(), n = $('lname').value.trim();
      if (!/^https?:\/\//i.test(u)) { toast('Paste a full link that starts with https://'); return; }
      save({ links: x.links.concat([{ name: n || u, url: u }]) }).then(function () { spaceDetail(id); });
    };
    document.querySelectorAll('[data-lrm]').forEach(function (b) {
      b.onclick = function () {
        var i = +b.getAttribute('data-lrm'), old = x.links.slice();
        x.links = x.links.filter(function (_, j) { return j !== i; }); spaceDetail(id);
        undoLater('Link removed', function () { save({ links: x.links }); }, function () { x.links = old; spaceDetail(id); });
      };
    });
    document.querySelectorAll('[data-frm]').forEach(function (b) {
      b.onclick = function () {
        var fid = b.getAttribute('data-frm'), f = x.files.filter(function (y) { return y.id === fid; })[0], at = x.files.indexOf(f);
        x.files.splice(at, 1); spaceDetail(id);
        undoLater(f.name + ' removed', function () { api({ action: 'file-delete', id: fid }); }, function () { x.files.splice(at, 0, f); spaceDetail(id); });
      };
    });
    var dz = $('xdrop'), pick = document.createElement('input'); pick.type = 'file'; pick.multiple = true;
    var up = function (files) {
      Array.prototype.reduce.call(files, function (p, f) {
        return p.then(function () {
          if (f.size > 3000000) { toast(f.name + ' is over 3 MB. Add it as a link instead.'); return; }
          toast('Adding ' + f.name + '...');
          return new Promise(function (res) { var rd = new FileReader(); rd.onload = function () { res(String(rd.result).split(',')[1] || ''); }; rd.readAsDataURL(f); })
            .then(function (b64) { return api({ action: 'file-add', spaceId: x.id, name: f.name, mime: f.type || 'application/octet-stream', b64: b64 }); })
            .then(function (r) { if (!r.ok) toast(r.note || 'Could not add ' + f.name); });
        });
      }, Promise.resolve()).then(load).then(function () { if (location.hash === '#spaces/' + id) spaceDetail(id); });
    };
    dz.onclick = function () { pick.click(); };
    pick.onchange = function () { up(pick.files); };
    dz.ondragover = function (e) { e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave = function () { dz.classList.remove('over'); };
    dz.ondrop = function (e) { e.preventDefault(); dz.classList.remove('over'); up(e.dataTransfer.files); };
    $('xmail').onclick = function () { S.email.spaceId = x.id; location.hash = '#email'; };
    $('xdel').onclick = function () {
      var at = S.spaces.indexOf(x); S.spaces.splice(at, 1); location.hash = '#spaces';
      undoLater('Space ' + x.name + ' deleted', function () { api({ action: 'space-delete', id: x.id }); }, function () { S.spaces.splice(at, 0, x); route(); });
    };
  }

  load();
  route();
  /* Progress on running sends refreshes every minute while the email page is open. */
  setInterval(function () { if ((location.hash || '').indexOf('#email') === 0 && S.sends.some(function (s) { return s.status === 'queued' || s.status === 'sending'; })) api().then(function (d) { S.sends = d.sends || S.sends; if (document.activeElement && /esub|ebody|eaddr/.test(document.activeElement.id)) return; email(); }); }, 60000);
})();
</script>
</body>
</html>
