<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Links, visual preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090c;--card:#121319;--line:rgba(120,150,255,.16);--ink:#e9eefa;--ink2:#a3b0d2;--ink3:#6f7fa8;--blue:#2E6BF2;--blue2:#5B8CFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.4 Inter,system-ui,sans-serif}
.wrap{max-width:1600px;margin:0 auto;padding:22px 24px 80px}
.note{background:#141a2e;border:1px solid rgba(91,140,255,.35);border-radius:12px;padding:10px 16px;margin-bottom:18px;color:#c8d6ff;font-size:13.5px}
.note b{color:#fff}
.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em}
.search{flex:1;min-width:260px;height:50px;border-radius:14px;border:1px solid var(--line);background:#0f1016;color:var(--ink);font:inherit;font-size:17px;padding:0 18px}
.search:focus{outline:2px solid var(--blue);border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink2);font:700 13px Inter;border-radius:999px;padding:8px 14px;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{height:44px;border-radius:12px;border:0;background:var(--blue);color:#fff;font:800 14px Inter;padding:0 18px;cursor:pointer}
/* Hero: the pinned eight, big */
.hero{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;grid-template-rows:170px 170px;gap:12px;margin-bottom:34px}
.hero .tile:first-child{grid-row:1/3}
.tile{position:relative;border-radius:16px;overflow:hidden;background:#151821;text-decoration:none;color:#fff;display:block;isolation:isolate;transition:transform .18s ease,box-shadow .18s ease}
.tile:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 0 2px var(--blue2)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;z-index:-2}
.tile .ph{position:absolute;inset:0;z-index:-2;display:grid;place-items:center;padding-bottom:42px!important;font-weight:800;letter-spacing:-.03em;color:rgba(255,255,255,.92);text-align:center;padding:12px}
.tile::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(5,6,10,.92) 100%)}
.tile .cap{position:absolute;left:12px;right:12px;bottom:10px}
.tile .cap b{display:block;font-size:14.5px;line-height:1.25;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.tile .cap span{font-size:11.5px;color:#b9c4e6}
.hero .tile:first-child .cap b{font-size:22px}
.hero .tile:first-child .ph{font-size:46px}
/* Shelves: one row each, scroll sideways */
.shelf{margin-bottom:30px}
.sh{display:flex;align-items:baseline;gap:12px;margin:0 0 10px}
.sh h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sh em{font-style:normal;color:var(--blue2);font-weight:800}
.sh .groups{display:flex;gap:6px;flex-wrap:wrap;margin-left:6px}
.sh .groups span{font-size:12px;font-weight:700;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.sh .groups span.on{color:#fff;border-color:var(--blue2)}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:220px;gap:12px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory}
.row::-webkit-scrollbar{height:8px}.row::-webkit-scrollbar-thumb{background:#232838;border-radius:8px}
.row .tile{height:150px;scroll-snap-align:start}
.row .tile .ph{font-size:26px}
.tag{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:rgba(8,9,12,.72);border-radius:6px;padding:3px 7px;color:#cfd8f5}
.dim{opacity:.18;filter:grayscale(1)}
.hit{box-shadow:0 0 0 3px var(--blue2)!important}
.empty{color:var(--ink3);padding:40px 0}
@media (max-width:900px){.hero{grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,140px)}.hero .tile:first-child{grid-row:auto;grid-column:1/3}}
</style>
</head>
<body>
<div class="wrap">
  <div class="note"><b>Preview only.</b> Links as pictures: your real links and their page images. The eight you open most sit big on top. Everything else lives on five shelves you scroll sideways. Type in search and the matches light up, the rest fade.</div>
  <div class="top"><h1>Links</h1><input class="search" id="q" placeholder="Find a link by name or site" autocomplete="off"><button class="btn" type="button">+ Add link</button></div>
  <div class="chips" id="chips"></div>
  <div class="hero" id="hero"></div>
  <div id="shelves"><div class="empty">Loading your links...</div></div>
</div>
<script>
(function () {
  var SHELF = [
    ['Raise', 'Investors, platforms and how-to'],
    ['Market', 'Regulators, research, competitors'],
    ['Company', 'Our sites, pitch, lists'],
    ['Build', 'Tools, AI, partners'],
    ['Personal', 'Learning and music']
  ];
  var MAP = {
    'vc|funds': ['Raise', 'Funds and angels'], 'vc|incubators': ['Raise', 'Research tools'], 'vc|': ['Raise', 'Funds and angels'],
    'vc platforms|': ['Raise', 'Research tools'], 'fund raising|data room': ['Raise', 'How to raise'], 'fund raising|': ['Raise', 'How to raise'],
    'resources|vc': ['Raise', 'How to raise'], 'company|data room': ['Raise', 'Data room'],
    'regulation|': ['Market', 'Regulators'], 'market validation|regulation': ['Market', 'Regulators'], 'market validation|research': ['Market', 'Research'],
    'research|': ['Market', 'Research'], 'validation|': ['Market', 'Research'], 'incumbents|': ['Market', 'Competitors'],
    'company|websites': ['Company', 'Our sites'], 'company|brand dev and launch': ['Company', 'Pitch and brand'], 'notes & docs|pitch': ['Company', 'Pitch and brand'],
    'notes & docs|lists': ['Company', 'Lists'], 'notes & docs|meetings': ['Company', 'Meetings and SOPs'],
    'tools & ops|': ['Build', 'Daily tools'], 'ai|platform': ['Build', 'Platform'], 'ai|model layers': ['Build', 'AI models'], 'ai|': ['Build', 'AI models'],
    'partners & dev|': ['Build', 'Partners'], 'partners & dev|prospect': ['Build', 'Partners'],
    'chad|': ['Personal', 'Learning'], 'resources|negotiation': ['Personal', 'Learning'], 'music|': ['Personal', 'Music']
  };
  var PINS = [/4orm ops/i, /^gohighlevel . 4orm sub-account/i, /^google drive$/i, /4orm data room/i, /vercel deployments/i, /^docsend$/i, /clickup workspace/i, /claude api/i];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return String(u || ''); } }
  function hue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  function word(d) { var p = d.split('.'); var w = p.length > 2 && /^(app|dashboard|platform|data|apply|signal)$/.test(p[0]) ? p[1] : p[0]; return w.charAt(0).toUpperCase() + w.slice(1); }
  function tile(l, tag) {
    var d = host(l.url);
    var h = hue(d);
    var img = l.thumb_url && l.thumb_status === 'ok' ? '<img loading="lazy" alt="" src="' + esc(l.thumb_url) + '" onerror="this.remove()">' : '';
    var ph = '<div class="ph" style="background:linear-gradient(140deg,hsl(' + h + ',62%,34%),hsl(' + ((h + 40) % 360) + ',70%,16%))">' + esc(word(d)) + '</div>';
    return '<a class="tile" target="_blank" rel="noopener" href="' + esc(l.url) + '" data-s="' + esc((l.title + ' ' + d + ' ' + (l._sh || '') + ' ' + (l._g || '')).toLowerCase()) + '">'
      + ph + img + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '') + '<div class="cap"><b>' + esc(String(l.title).replace(/\s+[—–-]\s+/g, ' · ')) + '</b><span>' + esc(d) + '</span></div></a>';
  }
  function paint(links) {
    var seen = {};
    links.forEach(function (l) {
      var k = String(l.cat || '').toLowerCase() + '|' + String(l.sub || '').toLowerCase();
      var m = MAP[k] || ['Personal', 'Other'];
      l._sh = m[0]; l._g = m[1];
      var key = host(l.url) + '|' + String(l.title).toLowerCase().slice(0, 6);
      l._dup = !!seen[key] || (seen[host(l.url)] && /crunchbase|openvc/.test(host(l.url)));
      seen[key] = 1; seen[host(l.url)] = 1;
    });
    var pins = PINS.map(function (re) { return links.filter(function (l) { return re.test(String(l.title)); })[0]; }).filter(Boolean);
    document.getElementById('hero').innerHTML = pins.map(function (l, i) { return tile(l, i === 0 ? 'Pinned' : ''); }).join('');
    document.getElementById('chips').innerHTML = '<button class="chip on" data-go="">Everything</button>' + SHELF.map(function (s) {
      var n = links.filter(function (l) { return l._sh === s[0] && !l._dup; }).length;
      return '<button class="chip" data-go="' + s[0] + '">' + s[0] + ' ' + n + '</button>';
    }).join('');
    document.getElementById('shelves').innerHTML = SHELF.map(function (s) {
      var rows = links.filter(function (l) { return l._sh === s[0] && !l._dup; });
      var groups = []; rows.forEach(function (l) { if (groups.indexOf(l._g) < 0) groups.push(l._g); });
      rows.sort(function (a, b) { return groups.indexOf(a._g) - groups.indexOf(b._g); });
      return '<section class="shelf" id="s-' + s[0] + '"><div class="sh"><h2>' + s[0] + '</h2><em>' + rows.length + '</em><div class="groups">' + groups.map(function (g) { return '<span data-g="' + esc(g) + '">' + esc(g) + '</span>'; }).join('') + '</div></div>'
        + '<div class="row">' + rows.map(function (l) { return tile(l, l._g); }).join('') + '</div></section>';
    }).join('');
  }
  document.addEventListener('click', function (e) {
    var c = e.target.closest('.chip');
    if (c) {
      document.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x === c); });
      var go = c.getAttribute('data-go');
      document.querySelectorAll('.shelf').forEach(function (s) { s.style.display = !go || s.id === 's-' + go ? '' : 'none'; });
      document.getElementById('hero').style.display = go ? 'none' : '';
      return;
    }
    var g = e.target.closest('.groups span');
    if (g) {
      var sec = g.closest('.shelf'); var on = !g.classList.contains('on');
      sec.querySelectorAll('.groups span').forEach(function (x) { x.classList.remove('on'); });
      if (on) g.classList.add('on');
      var row = sec.querySelector('.row');
      var first = null;
      row.querySelectorAll('.tile').forEach(function (t) { var m = !on || t.getAttribute('data-s').indexOf(g.getAttribute('data-g').toLowerCase()) >= 0; t.classList.toggle('dim', !m); if (m && !first) first = t; });
      if (first) row.scrollTo({ left: first.offsetLeft - row.offsetLeft - 2, behavior: 'smooth' });
    }
  });
  document.getElementById('q').addEventListener('input', function () {
    var v = this.value.trim().toLowerCase();
    document.querySelectorAll('.tile').forEach(function (t) {
      var m = v && t.getAttribute('data-s').indexOf(v) >= 0;
      t.classList.toggle('hit', !!m); t.classList.toggle('dim', !!v && !m);
    });
    if (v) { var f = document.querySelector('.row .tile.hit'); if (f) { var row = f.parentNode; row.scrollTo({ left: f.offsetLeft - row.offsetLeft - 2, behavior: 'smooth' }); } }
  });
  fetch('/api/board', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (d) {
    var links = (d && d.links) || [];
    if (!links.length) { document.getElementById('shelves').innerHTML = '<div class="empty">Sign in to 4ormop in this browser to see your links here.</div>'; return; }
    paint(links);
  }).catch(function () { document.getElementById('shelves').innerHTML = '<div class="empty">Sign in to 4ormop in this browser to see your links here.</div>'; });
})();
</script>
</body>
</html>
