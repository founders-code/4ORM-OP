<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>05g Spaces - cards and quick window - 4orm Ops</title>
<style>
/* ===== SHELL (shared by every page) ===== */
:root{--ground:#0b1430;--ground2:#13224a;--side:#08102a;--card:#fff;--ink:#101a33;--ink2:#4a5672;--ink3:#7a86a0;--line:#e8ecf3;--soft:#f5f7fb;
--blue:#2e6bf2;--blue50:#eaf1fe;--green:#12a36a;--green50:#e4f6ee;--amber:#c98408;--amber50:#fff4e0;--red:#e0364f;--red50:#fde9ec;--violet:#6b4fd8;
font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}html{background:#0d1838}
body{background:linear-gradient(165deg,var(--ground),var(--ground2)) fixed;color:var(--ink);min-height:100vh;display:grid;grid-template-columns:224px minmax(0,1fr);grid-template-rows:56px auto}
button{font:inherit;cursor:pointer}
.top{grid-column:1/-1;height:56px;background:#fff;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line)}
.logo img{height:30px;display:block}
.crumb{font-size:14px;font-weight:700;color:var(--ink);padding-left:12px;border-left:1px solid var(--line)}
.top .r{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb{height:32px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 12px;font-size:12.5px;font-weight:650;color:var(--ink);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tb .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.clock{font-size:12.5px;color:var(--ink3);font-weight:600;white-space:nowrap;margin-left:6px}
.side{background:var(--side);padding:14px 10px;display:flex;flex-direction:column;gap:2px;min-height:calc(100vh - 56px)}
.grp{font-size:13.5px;font-weight:850;color:#5b8cff;padding:16px 12px 6px;margin-top:6px;border-top:1px solid rgba(255,255,255,.08);letter-spacing:-.01em}.side .grp:first-child{border-top:none;margin-top:0;padding-top:4px}.side .nav{padding-left:16px}
.nav{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:9px;color:#cfd8ee;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.nav:hover{background:rgba(255,255,255,.05)}.nav.on{background:rgba(46,107,242,.22);color:#fff}
.nav .n{margin-left:auto;font-size:11px;font-weight:700;color:#b9c6e6;background:rgba(255,255,255,.08);border-radius:999px;padding:1px 8px}
.main{padding:20px 24px 40px;min-width:0}

/* ===== SPACES CARDS ===== */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.bar h1{margin:0;font-size:24px;font-weight:850;color:#fff;letter-spacing:-.02em}
.bar .sub{font-size:13px;color:#9fb0d0;font-weight:500}
.bar .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:2px}.seg span{font-size:12px;font-weight:700;padding:5px 12px;border-radius:7px;color:var(--ink3);cursor:pointer;white-space:nowrap}.seg span.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:700;padding:0 13px;white-space:nowrap}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#dbe4fb}
.btn.sm{height:30px;font-size:12.5px;padding:0 10px}
.search{height:34px;width:240px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;border-radius:10px;padding:0 12px;font:inherit;font-size:13px;outline:none}
.search::placeholder{color:#8fa0c8}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.kpis span{font-size:12.5px;font-weight:700;color:#dbe4fb;background:rgba(255,255,255,.07);border-radius:999px;padding:5px 12px}.kpis b{color:#fff}.kpis .hot b{color:#7ff0b5}

.cat{margin-bottom:18px}
.ch{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.04);cursor:grab;user-select:none}
.ch .grab{font-size:11px;font-weight:800;color:#7f90b8;letter-spacing:.06em}
.ch h2{margin:0;font-size:16px;font-weight:850;color:#fff}
.ch .n{font-size:12px;font-weight:800;color:#b9c6e6;background:rgba(255,255,255,.1);border-radius:999px;padding:1px 9px}
.ch .sum{font-size:12px;color:#8fa0c8;font-weight:600}
.ch .tg{margin-left:auto;font-size:12.5px;font-weight:750;color:#9db9ff;cursor:pointer}
.cat.min .grid{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;padding-top:12px}
.sp{background:#fff;border-radius:16px;box-shadow:0 12px 30px rgba(3,10,30,.28);cursor:pointer;display:flex;flex-direction:column;min-width:0;transition:transform .15s,box-shadow .15s;user-select:none}
.sp:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(3,10,30,.38)}
.sp.cur{box-shadow:0 0 0 3px #5b8cff,0 18px 40px rgba(3,10,30,.38)}
.sp .hd{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:850;flex:none}
.sp h4{margin:0;font-size:15.5px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.sp .org{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ring{margin-left:auto;width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:850;color:var(--ink2);background:conic-gradient(var(--c,var(--green)) var(--p),#e3e9f4 0);position:relative}
.ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}.ring span{position:relative;z-index:1}
.sp .why{margin:0 16px;font-size:13px;line-height:1.5;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:12px 16px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{padding:8px 10px;border-left:1px solid var(--line);min-width:0}.facts div:first-child{border-left:0}
.facts b{display:block;font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts small{font-size:11px;color:var(--ink3);font-weight:650}
.steps{display:flex;gap:4px;margin:12px 16px 0}
.steps i{flex:1;height:6px;border-radius:999px;background:#e3e9f4}.steps i.d{background:var(--green)}
.sp .ft{display:flex;align-items:center;gap:8px;padding:12px 16px 14px;margin-top:auto}
.nx{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--blue50);color:var(--blue);white-space:nowrap}
.nx.red{background:var(--red50);color:var(--red)}.nx.amb{background:var(--amber50);color:var(--amber)}.nx.grn{background:var(--green50);color:var(--green)}
.sp .ft .bund{font-size:12px;color:var(--ink3);font-weight:650;white-space:nowrap}
.sp .ft .go{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--blue)}
.addsp{border:2px dashed rgba(157,185,255,.3);border-radius:16px;display:grid;place-items:center;color:#9fb0d0;font-size:13.5px;font-weight:700;min-height:200px;cursor:pointer}

/* quick window */
.scrim{position:fixed;inset:56px 0 0 224px;background:rgba(5,10,28,.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.qw{position:fixed;top:68px;right:14px;bottom:14px;width:min(620px,48vw);background:#fff;border-radius:20px;box-shadow:0 30px 90px rgba(3,10,30,.55);z-index:50;display:flex;flex-direction:column;transform:translateX(110%);transition:transform .32s cubic-bezier(.32,.72,0,1)}
.qw.on{transform:none}
@media (prefers-reduced-motion:reduce){.qw,.scrim{transition:none}}
.qh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.qh .cr{font-size:12.5px;color:var(--ink3);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qh .cr b{color:var(--ink)}
.qh .r{margin-left:auto;display:flex;gap:6px}
.qb{overflow:auto;flex:1;padding:16px 18px 18px}
.hero{display:flex;gap:14px;align-items:center}
.hero .av{width:54px;height:54px;font-size:18px;border-radius:15px}
.hero h2{margin:0;font-size:22px;font-weight:850;letter-spacing:-.02em;outline:none;border-radius:6px}
.hero h2:focus{box-shadow:0 0 0 2px var(--blue)}
.hero .org{font-size:13px;color:var(--ink2);margin-top:2px;outline:none;border-radius:6px}
.hero .org:focus{box-shadow:0 0 0 2px var(--blue)}
.hero .ring{width:58px;height:58px;font-size:14px}.hero .ring::after{inset:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tags span{font-size:11.5px;font-weight:800;border-radius:7px;padding:3px 9px;background:var(--soft);color:var(--ink2)}
.tags .cat2{background:var(--blue50);color:var(--blue)}
.qfacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;margin-top:14px;overflow:hidden}
.qfacts div{padding:9px 11px;border-left:1px solid var(--line)}.qfacts div:first-child{border-left:0}
.qfacts b{display:block;font-size:14px;font-weight:850}.qfacts small{font-size:11px;color:var(--ink3);font-weight:650}
.qs{margin-top:16px}
.qs h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:13.5px;font-weight:850}
.qs h3 .s{font-size:12px;color:var(--ink3);font-weight:600}.qs h3 .a{margin-left:auto;font-size:12.5px;font-weight:750;color:var(--blue);cursor:pointer}
.ang{font-size:14px;line-height:1.6;background:var(--soft);border-radius:12px;padding:11px 13px;outline:none;min-height:46px}
.ang:empty::before{content:"No angle yet - press Rewrite, or type one";color:var(--ink3)}
.ang:focus{box-shadow:0 0 0 2px var(--blue)}
.note{background:#fff6c9;border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.55;outline:none;min-height:60px}
.note:focus{box-shadow:0 0 0 2px var(--blue)}
.chk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.chk label{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:650;cursor:pointer}
.chk label i{width:18px;height:18px;border-radius:6px;border:2px solid #c3cde0;flex:none}
.chk label.d i{background:var(--green);border-color:var(--green)}.chk label.d{color:var(--ink3)}
.bund{display:flex;flex-wrap:wrap;gap:8px}
.bund span{font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.bund .add{border-style:dashed;color:var(--blue);cursor:pointer}
.ppl{display:flex;flex-wrap:wrap;gap:6px}.ppl span{font-size:12.5px;font-weight:750;background:var(--soft);border-radius:999px;padding:5px 11px}.ppl .add{background:none;border:1px dashed #c3cde0;color:var(--blue);cursor:pointer}
.hist div{display:flex;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--ink2)}.hist small{color:var(--ink3);font-weight:700;width:86px;flex:none}
.qf{display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.qf .st{font-size:12.5px;color:var(--ink2);font-weight:650;flex:1;min-width:0}
.qf .st b{color:var(--green)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;display:none;z-index:90}.toast.show{display:block}

/* Space menu: opens right under the dots, inside the card's view. Text only. */
.sp .hd{position:relative}
.ms{flex:none;align-self:flex-start;margin-left:2px;height:26px;padding:0 8px;border-radius:8px;font-weight:900;letter-spacing:1px;color:#7a86a0;cursor:pointer;display:grid;place-items:center;line-height:1}
.ms:hover,.ms.on{background:#eef2f8;color:#101a33}
.smenu{position:fixed;z-index:80;width:236px;background:#fff;border:1px solid #e3e8f1;border-radius:12px;box-shadow:0 18px 50px rgba(3,10,30,.35);padding:6px;display:none;font-size:13px}
.smenu.on{display:block}
.smenu .it{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;cursor:pointer;color:#101a33;font-weight:650}
.smenu .it:hover{background:#f3f6fb}
.smenu .it small{font-size:11.5px;color:#7a86a0;font-weight:600}
.smenu hr{border:0;border-top:1px solid #eef1f6;margin:5px 4px}
.smenu .grp{padding:4px 10px 6px;display:flex;flex-wrap:wrap;gap:5px}
.smenu .grp span{font-size:12px;font-weight:700;border:1px solid #e3e8f1;border-radius:999px;padding:3px 9px;cursor:pointer;color:#33405a}
.smenu .grp span.cur{background:#eaf1fe;border-color:#c9d8ff;color:#2e6bf2}
.smenu .grp span:hover{border-color:#2e6bf2}
.smenu .lb{font-size:11.5px;color:#7a86a0;font-weight:700;padding:6px 10px 2px}
.smenu .it.red{color:#d6334e}
.smenu .ren{display:flex;gap:6px;padding:4px 6px}
.smenu .ren input{flex:1;height:30px;border:1.5px solid #2e6bf2;border-radius:7px;padding:0 8px;font:inherit;font-size:12.5px;outline:none}
.toast2{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f1a3a;color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;display:none;z-index:90}.toast2.show{display:block}.toast2 a{color:#9cc0ff;margin-left:10px;cursor:pointer}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"></head>
<body>
<header class="top">
  <div class="logo"><img src="../assets/logo-finance.png" alt="4orm Finance"></div><span class="crumb">Spaces</span>
  <div class="r"><span class="tb">Today</span><span class="tb">Calendar</span><span class="tb"><span class="dot"></span>Signals</span><span class="tb">Sound on</span><span class="clock">Mon, Oct 26 &middot; 14:05 Pacific</span></div>
</header>
<nav class="side" id="side"></nav>
<main class="main">
  <div class="bar"><h1>Spaces</h1><span class="sub">Every send-bundle, grouped by who it's for</span>
    <div class="r"><input class="search" id="q" placeholder="Search spaces or people"><div class="seg"><span class="on">Groups</span><span>Board</span></div><button class="btn ghost" id="minAll">Collapse all</button><button class="btn pri">+ New space</button></div></div>
  <div class="kpis"><span><b>53</b> spaces</span><span class="hot"><b>2</b> ready to send</span><span><b>4</b> need docs</span><span><b>0</b> sent this week</span><span><b>0</b> replies</span><span><b>0</b> meetings booked</span></div>
  <div id="cats"></div>
</main>
<div class="scrim" id="scrim"></div>
<aside class="qw" id="qw" role="dialog" aria-label="Space">
  <div class="qh"><span class="cr" id="qCr"></span><div class="r"><button class="btn sm" id="prev">&lsaquo; Prev</button><button class="btn sm" id="next">Next &rsaquo;</button><button class="btn sm" id="full">Open full page</button><button class="btn sm" id="close">Close</button></div></div>
  <div class="qb" id="qb"></div>
  <div class="qf"><span class="st" id="qSt"></span><button class="btn sm" id="drive">Move to Drive</button><button class="btn sm" id="book">Book 20 min</button><button class="btn sm" id="email">Email them</button><button class="btn sm pri" id="send">Send bundle</button></div>
</aside>
<div class="toast" id="toast"></div>
<script>
const NAV=[["Today"],["Playbook"],["War Room"],["Calendar"],["Email"],["People"],["Contacts"],["Spaces"],["Pipeline",0,"246"],["Library"],["Notes"],["Documents"],["Drive"],["Links"],["Recordings"],["Record"],["Zoom"],["Completed"],["Signals"],["News"],["Financials"],["Integrations",0,"6"]];
const GROUPS=["Today","People","Library","Record","Signals"];
document.getElementById('side').innerHTML=NAV.map(n=>GROUPS.includes(n[0])?`<div class="grp">${n[0]}</div>`:`<div class="nav${n[0]=='Spaces'?' on':''}">${n[0]}${n[2]?`<span class="n">${n[2]}</span>`:''}</div>`).join('');
const T=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)};
const COL=['#2e6bf2','#12a36a','#c98408','#6b4fd8','#e0364f','#0f8a8a'];
const STEPS=['Person','Notes','Docs attached','Link added','Intro written'];
let CATS=[
 {name:'General',min:false,sp:[
  {n:'Regulator intro',o:'Template for regulator first contact',why:'The intro we send to BCFSA, FSRA and AMF. Leads with conduct risk.',d:[1,1,0,0,0],last:'-',em:0,stage:'draft',nx:['Add docs','amb'],docs:0,links:0},
  {n:'Friends & Family email',o:'Round update for the F&F list',why:'Monthly note to friends and family investors: progress, raise status, one ask.',d:[1,1,0,0,0],last:'12 Oct',em:14,stage:'sent',nx:['Write intro','amb'],docs:1,links:0},
  {n:'Design partners',o:'Pack for credit unions and brokers',why:'Pilot pitch: what changes for their advisors, 30-day pilot, pricing for 10 seats.',d:[1,1,1,0,0],last:'22 Oct',em:6,stage:'pilot',nx:['Add the link','amb'],docs:2,links:0}]},
 {name:'Venture Capital',min:false,sp:[
  {n:'Joe Canavan',o:'Angel - email first',why:'Backs fintech infrastructure. Wants the base case and the raise terms in one page.',d:[1,1,1,1,0],last:'-',em:0,stage:'Storage',nx:['Send today','red'],docs:2,links:1},
  {n:'Neil Mitchell',o:'Marsh Canada MD - insurtech angel',why:'Backed QuickFacts. Lead with conduct risk in insurance distribution, not AI.',d:[1,1,1,0,0],last:'-',em:0,stage:'Storage',nx:['Add docs','amb'],docs:1,links:4},
  {n:'Norm Cappell',o:'Angel - Calgary network',why:'Knows the Alberta credit unions. Ask for two intros rather than a cheque first.',d:[1,1,0,0,0],last:'3 Oct',em:2,stage:'Cold',nx:['Write intro','amb'],docs:0,links:0},
  {n:'Mench Capital',o:'Investor - Mike Gardner',why:'Questions on the capture rate. Send the base case and the three scenarios.',d:[1,1,1,1,1],last:'20 Oct',em:5,stage:'Info pack sent',nx:['Ready to send','grn'],docs:3,links:1}]},
 {name:'Business',min:false,sp:[
  {n:'Bow Valley Credit Union',o:'Design partner - compliance lead',why:'Board wants a sample record and pricing on one page before Thursday 10:00.',d:[1,1,1,0,0],last:'22 Oct',em:8,stage:'Meeting booked',nx:['Attach sample','red'],docs:2,links:0},
  {n:'Enrich Mortgage Group',o:'Broker group - discovery',why:'Wants proof of what each client was told before signing. 30-day pilot, 2 brokers.',d:[1,1,0,0,0],last:'26 Oct',em:3,stage:'Contact made',nx:['Book discovery','amb'],docs:0,links:0},
  {n:'Tom Robertson',o:'Mortgage broker',why:'Met at the CMT event. Interested in the read-back feature for his team.',d:[1,0,0,0,0],last:'-',em:0,stage:'Storage',nx:['Add notes','amb'],docs:0,links:0}]}];
let cur=null;
let flat=()=>CATS.flatMap((c,ci)=>c.sp.map((s,si)=>({s,ci,si})));
const ini=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const pct=s=>s.d.filter(Boolean).length;
function card(s,ci,si){const k=pct(s),c=k==5?'var(--green)':k>=3?'#2e6bf2':'#c98408';
 return `<div class="sp" draggable="true" data-c="${ci}" data-s="${si}"><div class="hd"><span class="av" style="background:${COL[(ci*3+si)%6]}">${ini(s.n)}</span><div style="min-width:0"><h4>${s.n}</h4><div class="org">${s.o}</div></div><span class="ring" style="--p:${k*20}%;--c:${c}"><span>${k}/5</span></span><span class="ms" data-ms="${ci}|${si}" data-action="space-menu" title="More">&middot;&middot;&middot;</span></div>
 <p class="why">${s.why}</p>
 <div class="facts"><div><b>${s.last}</b><small>last contact</small></div><div><b>${s.em}</b><small>emails</small></div><div><b>${s.stage}</b><small>pipeline stage</small></div></div>
 <div class="steps" title="${STEPS.map((x,i)=>(s.d[i]?'done: ':'to do: ')+x).join(', ')}">${s.d.map(x=>`<i class="${x?'d':''}"></i>`).join('')}</div>
 <div class="ft"><span class="nx ${s.nx[1]}">${s.nx[0]}</span><span class="bund">${s.docs} docs &middot; ${s.links} links</span><span class="go">Open</span></div></div>`;}
function render(){const q=(document.getElementById('q').value||'').toLowerCase();
 document.getElementById('cats').innerHTML=CATS.map((c,ci)=>{const list=c.sp.map((s,si)=>[s,si]).filter(([s])=>!q||(s.n+' '+s.o).toLowerCase().includes(q));const ready=c.sp.filter(s=>pct(s)==5).length;
 return `<div class="cat${c.min?' min':''}" data-c="${ci}"><div class="ch" draggable="true"><span class="grab">MOVE</span><h2>${c.name}</h2><span class="n">${c.sp.length}</span><span class="sum">${ready} ready &middot; ${c.sp.filter(s=>s.nx[1]=='red').length} due today</span><span class="tg" data-tg="${ci}">${c.min?'Expand':'Collapse'}</span></div><div class="grid">${list.map(([s,si])=>card(s,ci,si)).join('')}<div class="addsp">+ New space in ${c.name}</div></div></div>`;}).join('');
 if(cur)markCur();}
render();
document.getElementById('q').oninput=render;
document.getElementById('minAll').onclick=e=>{const any=CATS.some(c=>!c.min);CATS.forEach(c=>c.min=any);e.target.textContent=any?'Expand all':'Collapse all';render();};

/* quick window */
const qw=document.getElementById('qw'),scrim=document.getElementById('scrim');
function markCur(){document.querySelectorAll('.sp').forEach(e=>e.classList.toggle('cur',cur&&+e.dataset.c==cur.ci&&+e.dataset.s==cur.si));}
function open(ci,si){cur={ci,si};const s=CATS[ci].sp[si],k=pct(s),c=k==5?'var(--green)':k>=3?'#2e6bf2':'#c98408';
 document.getElementById('qCr').innerHTML=`${CATS[ci].name} / <b>${s.n}</b>`;
 document.getElementById('qb').innerHTML=`<div class="hero"><span class="av" style="background:${COL[(ci*3+si)%6]}">${ini(s.n)}</span><div style="min-width:0;flex:1"><h2 contenteditable="true" spellcheck="false" id="eName">${s.n}</h2><div class="org" contenteditable="true" spellcheck="false" id="eOrg">${s.o}</div></div><span class="ring" style="--p:${k*20}%;--c:${c}"><span>${k}/5</span></span></div>
 <div class="tags"><span class="cat2">${CATS[ci].name}</span><span>${s.stage}</span><span>${s.em?'In touch':'Never contacted'}</span></div>
 <div class="qfacts"><div><b>${s.last}</b><small>last contact</small></div><div><b>${s.em}</b><small>emails</small></div><div><b>${s.stage}</b><small>pipeline stage</small></div><div><b>${s.docs+s.links}</b><small>in the bundle</small></div></div>
 <div class="qs"><h3>The angle<span class="s">4orm Intelligence</span><span class="a" id="rw">Rewrite</span><span class="a" id="rs">Research</span></h3><div class="ang" contenteditable="true" id="eAng">${s.why}</div></div>
 <div class="qs"><h3>Ready to send<span class="s">${k} of 5 done</span></h3><div class="chk">${STEPS.map((x,i)=>`<label class="${s.d[i]?'d':''}" data-st="${i}"><i></i>${x}</label>`).join('')}</div></div>
 <div class="qs"><h3>Bundle<span class="s">what goes out</span></h3><div class="bund">${s.docs?'<span>4orm one-pager.pdf</span>':''}${s.docs>1?'<span>Base case model.pdf</span>':''}${s.links?'<span>Readiness check link</span>':''}<span class="add" data-t="Pick from Documents, Drive or your computer">+ Add a file</span><span class="add" data-t="Pick from your saved Links">+ Add a link</span></div></div>
 <div class="qs"><h3>People<span class="s">who this is for</span></h3><div class="ppl"><span>${s.n}</span><span class="add" data-t="Search Contacts and Pipeline">+ Add a person</span></div></div>
 <div class="qs"><h3>Notes<span class="s">saves as you type</span></h3><div class="note" contenteditable="true">${s.o}.</div></div>
 <div class="qs"><h3>History</h3><div class="hist"><div><small>${s.last=='-'?'Today':s.last}</small>Space created and notes captured</div>${s.em?`<div><small>${s.last}</small>${s.em} emails in the thread</div>`:''}</div></div>`;
 document.getElementById('qSt').innerHTML=`<b>${k}/5</b> ready to send${k<5?' &middot; '+STEPS.filter((x,i)=>!s.d[i]).slice(0,2).join(', ').toLowerCase()+' left':''}`;
 qw.classList.add('on');scrim.classList.add('on');markCur();
 const save=(key)=>e=>{const v=e.target.textContent.trim();if(v&&v!=s[key]){s[key]=v;render();T('Saved');}};
 document.getElementById('eName').addEventListener('blur',save('n'));document.getElementById('eOrg').addEventListener('blur',save('o'));document.getElementById('eAng').addEventListener('blur',save('why'));
}
function close(){qw.classList.remove('on');scrim.classList.remove('on');cur=null;markCur();}
document.getElementById('cats').addEventListener('click',e=>{const tg=e.target.closest('[data-tg]');if(tg){CATS[+tg.dataset.tg].min=!CATS[+tg.dataset.tg].min;render();return;}if(e.target.closest('.addsp')){T('New space created - name it in the window');return;}const c=e.target.closest('.sp');if(c)open(+c.dataset.c,+c.dataset.s);});
scrim.onclick=close;document.getElementById('close').onclick=close;
document.addEventListener('keydown',e=>{if(!cur)return;if(e.key=='Escape')close();if(e.target.isContentEditable)return;if(e.key=='ArrowRight')step(1);if(e.key=='ArrowLeft')step(-1);});
function step(d){const f=flat();let i=f.findIndex(x=>x.ci==cur.ci&&x.si==cur.si);i=(i+d+f.length)%f.length;open(f[i].ci,f[i].si);}
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
document.getElementById('full').onclick=()=>T('Opens the full-page view of this space');
qw.addEventListener('click',e=>{const st=e.target.closest('[data-st]');if(st){const s=CATS[cur.ci].sp[cur.si];s.d[+st.dataset.st]=s.d[+st.dataset.st]?0:1;open(cur.ci,cur.si);render();T(s.d[+st.dataset.st]?'Ticked':'Unticked');return;}const t=e.target.closest('[data-t]');if(t)T(t.dataset.t);if(e.target.id=='rw')T('Rewriting the angle from the notes and the person');if(e.target.id=='rs')T('Researching with sources');});
['drive','book','email','send'].forEach(id=>document.getElementById(id).onclick=()=>T({drive:'Moves the bundle to Drive',book:'Opens the calendar with + 4orm Zoom',email:'Opens Compose with this person and the bundle',send:'Sends a test to chad@4ormfinance.com first, then asks you to approve'}[id]));
/* drag (same rules as 05d) */
let drag=null;
document.addEventListener('dragstart',e=>{const sp=e.target.closest('.sp');if(sp){drag={k:'sp',c:+sp.dataset.c,s:+sp.dataset.s};}else{const ch=e.target.closest('.ch');if(ch)drag={k:'cat',c:+ch.parentNode.dataset.c};}e.dataTransfer.setData('text/plain','x');});
document.addEventListener('dragover',e=>{if(drag)e.preventDefault();});
document.addEventListener('drop',e=>{if(!drag)return;e.preventDefault();const cat=e.target.closest('.cat');if(!cat){drag=null;return;}const to=+cat.dataset.c;
 if(drag.k=='sp'){const tgt=e.target.closest('.sp');const item=CATS[drag.c].sp.splice(drag.s,1)[0];let pos=tgt?+tgt.dataset.s:CATS[to].sp.length;if(to==drag.c&&tgt&&+tgt.dataset.s>drag.s)pos--;CATS[to].sp.splice(pos,0,item);T(`${item.n} moved to ${CATS[to].name}, position ${pos+1}`);}
 else{const c=CATS.splice(drag.c,1)[0];CATS.splice(to,0,c);T(`${c.name} is now ${['first','second','third','fourth'][to]}`);}
 drag=null;render();});
/* derived state for review and the visual check: #open shows the quick window on Mench Capital */
if(location.hash=='#open'||/card-open/.test(location.pathname))open(1,3);
</script>

<div class="smenu" id="smenu" role="menu"></div><div class="toast2" id="toast2"></div>
<script>
/* Space menu (05g). Live: each item calls the existing space API; Delete is a soft archive with Undo. */
(function(){const m=document.getElementById('smenu');let cur=null,anchor=null;
 const T=(h,undo)=>{const t=document.getElementById('toast2');t.innerHTML=h+(undo?'<a id="u2">Undo</a>':'');t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),undo?6000:2000);if(undo)document.getElementById('u2').onclick=()=>{undo();t.classList.remove('show')}};
 function open(el){const [ci,si]=el.dataset.ms.split('|').map(Number);cur={ci,si};anchor=el;const sp=CATS[ci].sp[si];
  m.innerHTML=`<div class="it" data-m="open">Open<small>Return</small></div>
  <div class="it" data-m="rename">Rename</div>
  <div class="lb">Move to group</div><div class="grp">${CATS.map((c,i)=>`<span data-m="move" data-to="${i}" class="${i===ci?'cur':''}">${c.name}</span>`).join('')}</div>
  <hr><div class="it" data-m="pin">${sp.pin?'Unpin':'Pin to top'}</div>
  <div class="it" data-m="people">Add people</div>
  <div class="it" data-m="link">Copy link</div>
  <div class="it" data-m="drive">Move to Drive<small>${sp.docs} docs</small></div>
  <hr><div class="it red" data-m="del">Delete space</div>`;
  document.querySelectorAll('.ms.on').forEach(x=>x.classList.remove('on'));el.classList.add('on');
  const r=el.getBoundingClientRect();m.classList.add('on');let left=r.right-m.offsetWidth,top=r.bottom+6;if(top+m.offsetHeight>innerHeight-10)top=r.top-m.offsetHeight-6;m.style.left=Math.max(10,left)+'px';m.style.top=top+'px'}
 function close(){m.classList.remove('on');document.querySelectorAll('.ms.on').forEach(x=>x.classList.remove('on'));cur=null}
 document.addEventListener('click',e=>{const d=e.target.closest('.ms');if(d){e.stopPropagation();e.preventDefault();cur&&anchor===d?close():open(d);return}
  if(!m.contains(e.target)){close();return}
  const it=e.target.closest('[data-m]');if(!it||!cur)return;const {ci,si}=cur;const sp=CATS[ci].sp[si];const a=it.dataset.m;
  if(a==='rename'){it.outerHTML=`<div class="ren"><input id="renIn" value="${sp.n}"><button class="btn" id="renOk">Save</button></div>`;const i=document.getElementById('renIn');i.focus();i.select();const sv=()=>{const v=i.value.trim();if(v){sp.n=v;close();render();T('Renamed')}};i.onkeydown=k=>{if(k.key==='Enter')sv();if(k.key==='Escape')close()};document.getElementById('renOk').onclick=sv;return}
  if(a==='move'){const to=+it.dataset.to;if(to===ci){close();return}const [x]=CATS[ci].sp.splice(si,1);CATS[to].sp.unshift(x);close();render();T(`Moved to <b>${CATS[to].name}</b>`,()=>{CATS[to].sp.shift();CATS[ci].sp.splice(si,0,x);render()});return}
  if(a==='pin'){sp.pin=!sp.pin;if(sp.pin){CATS[ci].sp.splice(si,1);CATS[ci].sp.unshift(sp)}close();render();T(sp.pin?'Pinned to the top of '+CATS[ci].name:'Unpinned');return}
  if(a==='del'){const [x]=CATS[ci].sp.splice(si,1);close();render();T(`<b>${x.n}</b> deleted.`,()=>{CATS[ci].sp.splice(si,0,x);render()});return}
  close();T({open:'Opens the space panel',people:'Pick people from Contacts',link:'Link copied',drive:'Moved to Drive: '+sp.docs+' docs'}[a])});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 /* state for the design: menu open on the first card */
 window.addEventListener('load',()=>setTimeout(()=>{const d=document.querySelector('.ms');d&&open(d)},60));
})();
</script>
</body></html>
