 rd.classList.add('on');pc.querySelectorAll('.row.mail').forEach(r=>r.classList.toggle('cur',+r.dataset.mail===ei));}
rd.onclick=e=>{const b=e.target.closest('[data-r=back]');if(b){rd.classList.remove('on');return;}const f=e.target.closest('.msg.fold');if(f){f.classList.remove('fold');return;}const m=e.target.closest('[data-msg]');if(m)T(m.dataset.msg);};
function card(p){const c=CAT[p.cat];return `<div class="pb" data-id="${p.id}" style="--c:${c[1]};--cbg:${c[2]}"><div class="h"><span class="av" style="background:${p.col}">${p.ini}</span><div style="min-width:0"><h4>${p.n}</h4><div class="org">${p.org}</div></div><span class="cat">${c[0]}</span></div>
 <div class="nums"><div><b>${p.from}</b><small>from them</small></div><div><b>${p.to}</b><small>from you</small></div><div><b>${p.files+p.links}</b><small>files, links</small></div><div class="${p.last.endsWith('m')||p.last.endsWith('h')?'hot':''}"><b>${p.last}</b><small>last</small></div></div>
 <div class="lt">Latest</div>${p.em.slice(0,3).map(e=>`<div class="em"><b>${e[1]}</b><span>${e[2]}</span></div>`).join('')}
 <div class="ft"><span class="fl">${p.files} files &middot; ${p.links} links</span>${p.owe?'<span class="owe">You owe a reply</span>':''}<span class="go">Open</span></div></div>`}
document.getElementById('grid').innerHTML=P.map(card).join('');
const pc=document.getElementById('pc'),scrim=document.getElementById('scrim');let cur=null,tab='em';
function openP(id){cur=P.find(p=>p.id==id);const p=cur,c=CAT[p.cat];pc.style.setProperty('--c',c[1]);
 pc.innerHTML=`<div class="ph"><div class="tl"><span class="cr">Email / People / ${c[0]}</span><div class="r"><button class="gb" data-a="prev">&lsaquo; Prev</button><button class="gb" data-a="next">Next &rsaquo;</button><button class="gb" data-a="close">Close</button></div></div>
 <div class="who"><span class="av" style="background:${p.col}">${p.ini}</span><div style="min-width:0"><h2>${p.n}</h2><div class="role">${p.role} &middot; ${p.org}</div><div class="tags"><span class="cc">${c[0]}</span>${p.owe?'<span>You owe a reply</span>':''}<span>${p.from+p.to} emails</span></div></div></div>
 <div class="info"><div><b>${p.org}</b><small>company</small></div><div><b>${p.role}</b><small>role</small></div><div><b>${p.stage}</b><small>pipeline stage</small></div><div><b>${p.meet}</b><small>last meeting</small></div><div class="${p.items?'hot':''}"><b>${p.items} open</b><small>items owed</small></div><div><b>${p.first}</b><small>first contact</small></div></div></div>
 <div class="tabs"><span data-t="em" class="${tab=='em'?'on':''}">Emails<i>${p.em.length}</i></span><span data-t="fl" class="${tab=='fl'?'on':''}">Files<i>${p.fl.length}</i></span><span data-t="lk" class="${tab=='lk'?'on':''}">Links<i>${p.lk.length}</i></span></div>
 <div class="pbody">${tab=='em'?p.em.map((e,ei)=>`<div class="row mail" data-mail="${ei}"><div><b><span class="dir ${e[0]}">${e[0]=='in'?'In':'Out'}</span>${e[1]}</b><p>${e[2]} ${BODY[0]}</p></div><div class="r"><span class="m">${e[3]}</span></div></div>`).join(''):
  tab=='fl'?(p.fl.length?p.fl.map(f=>`<div class="row"><div><b><span class="ty ${f[0]}">${f[0].toUpperCase()}</span>${f[1]}</b><p>${f[2]} &middot; from ${f[3]}</p></div><div class="r"><button class="btn" data-msg="Opens the file in the viewer">Open</button><button class="btn" data-msg="Downloads the file">Download</button><button class="btn" data-msg="Adds the file to a Space">To a Space</button></div></div>`).join(''):'<div class="row"><div><b>No files yet</b><p>Attachments from this person land here.</p></div></div>'):
  (p.lk.length?p.lk.map(l=>`<div class="row"><div><b>${l[0]}</b><p>${l[1]} &middot; ${l[2]}</p></div><div class="r"><button class="btn" data-msg="Opens the link in a new tab">Open</button><button class="btn" data-msg="Saved to Links">Save to Links</button></div></div>`).join(''):'<div class="row"><div><b>No links yet</b><p>Links found in the emails land here.</p></div></div>')}</div>
 <div class="pfoot"><button class="btn pri" data-msg="Opens Compose to ${p.n}">Email</button><button class="btn" data-msg="Opens the calendar with + 4orm Zoom">Book</button><button class="btn" data-msg="Opens the person in Pipeline">Pipeline</button><button class="btn" data-msg="Adds to a Space">Add to a Space</button><span class="sp"></span><button class="btn" data-msg="Opens the full contact">Contact</button></div>`;
 pc.classList.add('on');scrim.classList.add('on');document.querySelectorAll('.pb').forEach(b=>b.classList.toggle('cur',b.dataset.id==id));}
function closeP(){rd.classList.remove('on');pc.classList.remove('on');scrim.classList.remove('on');cur=null;document.querySelectorAll('.pb').forEach(b=>b.classList.remove('cur'));}
document.getElementById('grid').onclick=e=>{const b=e.target.closest('.pb');if(b){tab='em';openP(b.dataset.id);}};
scrim.onclick=()=>{rd.classList.remove('on');closeP();};document.addEventListener('keydown',e=>{if(e.key=='Escape'){if(rd.classList.contains('on'))rd.classList.remove('on');else closeP();}});
pc.onclick=e=>{const ml=e.target.closest('[data-mail]');if(ml){openMail(+ml.dataset.mail);return;}const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;openP(cur.id);return;}const a=e.target.closest('[data-a]');if(a){if(a.dataset.a=='close')closeP();else{const i=P.indexOf(cur);const n=P[(i+(a.dataset.a=='next'?1:P.length-1))%P.length];tab='em';openP(n.id);}return;}const m=e.target.closest('[data-msg]');if(m)T(m.dataset.msg);};
/* this file shows the open state: Bruce Fair, Emails tab (click an email to open the big reader) */
tab='em';openP('bf');openMail(0);
</script>
</body></html>
