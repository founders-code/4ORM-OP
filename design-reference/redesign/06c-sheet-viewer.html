<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documents - 4orm Ops</title><style>
:root{--ground:#0b1430;--ground2:#13224a;--side:#08102a;--card:#fff;--ink:#101a33;--ink2:#4a5672;--ink3:#7a86a0;--line:#e8ecf3;--soft:#f5f7fb;
--blue:#2e6bf2;--blue50:#eaf1fe;--green:#12a36a;--green50:#e4f6ee;--amber:#c98408;--amber50:#fff4e0;--red:#e0364f;--red50:#fde9ec;--violet:#6b4fd8;
font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}html{background:#0d1838}
body{background:linear-gradient(165deg,var(--ground),var(--ground2)) fixed;color:var(--ink);min-height:100vh;display:grid;grid-template-columns:224px minmax(0,1fr);grid-template-rows:56px auto}
button{font:inherit;cursor:pointer}
.top{grid-column:1/-1;height:56px;background:#fff;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px}
.crumb{font-size:14px;font-weight:700;padding-left:12px;border-left:1px solid var(--line)}
.top .r{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb{height:32px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 12px;font-size:12.5px;font-weight:650;color:var(--ink);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tb .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.clock{font-size:12.5px;color:var(--ink3);font-weight:600;white-space:nowrap;margin-left:6px}
/* ===== MENU (clean, fixed rows, nothing moves) ===== */
.side{background:var(--side);padding:16px 12px 20px;min-height:calc(100vh - 56px);position:sticky;top:0;align-self:start}
.side .sec{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#6f7fa6;padding:0 12px;height:26px;display:flex;align-items:flex-end;margin-top:18px;margin-bottom:4px}
.side .sec:first-child{margin-top:0}
.side .it{display:flex;align-items:center;height:34px;padding:0 12px;border-radius:8px;color:#cfd8ee;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;position:relative;transition:none;border:0;background:none;width:100%;text-align:left}
.side .it:hover{background:rgba(255,255,255,.05);color:#fff}
.side .it.on{background:rgba(46,107,242,.22);color:#fff;font-weight:700}
.side .it.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:#5b8cff}
.side .it .n{margin-left:auto;min-width:30px;text-align:center;font-size:11px;font-weight:700;color:#b9c6e6;background:rgba(255,255,255,.08);border-radius:999px;padding:1px 0}
.main{padding:20px 24px 40px;min-width:0}
.card{background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(3,10,30,.22);min-width:0}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar h1{margin:0;font-size:24px;font-weight:850;color:#fff;letter-spacing:-.02em}
.bar .sub{color:#aebbe0;font-size:13px;font-weight:600}
.bar .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px}
.seg span{padding:6px 14px;border-radius:8px;color:#d6def3;font-size:12.5px;font-weight:700;cursor:pointer}
.seg span.on{background:#fff;color:var(--ink)}
.search{height:34px;width:250px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;padding:0 12px;font:inherit;font-size:13px}
.search::placeholder{color:#9fb0d6}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:750;white-space:nowrap}
.p-blue{background:var(--blue50);color:var(--blue)}.p-green{background:var(--green50);color:#0e8a5f}.p-amber{background:var(--amber50);color:#9a6400}.p-gray{background:var(--soft);color:var(--ink2)}.p-red{background:var(--red50);color:var(--red)}.p-violet{background:#efeafe;color:var(--violet)}
.btn{height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;padding:0 12px;font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.gh{border:0;background:none;color:var(--blue);padding:0 6px}
.btn:disabled{opacity:.45;cursor:default}
.lnk{color:var(--blue);font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}
/* ===== CONTACTS · LISTS ===== */
.lwrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start}
.lists{padding:12px}
.lists h3{margin:4px 6px 10px;font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:.02em}
.li{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.li:hover{background:var(--soft)}
.li.on{background:var(--blue50);border-color:#cfdcfb}
.li b{font-size:13.5px;font-weight:750}.li span{font-size:12px;color:var(--ink3);font-weight:600}
.li .bar2{height:4px;border-radius:4px;background:var(--line);margin-top:5px;overflow:hidden}.li .bar2 i{display:block;height:100%;background:var(--green)}
.newl{margin-top:8px;border:1.5px dashed #d3dbea;color:var(--blue);font-weight:750;font-size:13px;border-radius:10px;padding:10px;text-align:center;cursor:pointer}
.lh{display:flex;align-items:center;gap:10px;padding:16px 18px 8px;flex-wrap:wrap}
.lh h2{margin:0;font-size:19px;font-weight:850;letter-spacing:-.01em}
.lh .st{font-size:12.5px;color:var(--ink3);font-weight:650}
.lh .r{margin-left:auto;display:flex;gap:8px;align-items:center;position:relative}
.prog{margin:0 18px 10px;height:6px;background:var(--line);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--green);transition:width .3s}
.tools{display:flex;gap:8px;align-items:center;padding:0 18px 12px;flex-wrap:wrap}
.chip{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.t th{position:sticky;top:0;background:#fafbfd;text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:800;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 10px;border-bottom:1px solid #f0f2f7;vertical-align:middle}
table.t tr.row{cursor:pointer}table.t tr.row:hover td{background:#f7f9fe}
table.t tr.row.sent td{background:#f6fbf8}
table.t tr.row.sent td.nm b{color:var(--ink3);text-decoration:line-through;text-decoration-color:#9fb0c8}
table.t td.nm b{font-weight:750;font-size:13.5px;display:block}
table.t td.nm small{color:var(--ink3);font-size:12px;font-weight:600}
table.t td.mut{color:var(--ink2);font-size:12.5px}table.t td.nw{white-space:nowrap}
table.t tr.gh td{background:#f3f6fc;font-weight:800;font-size:12.5px;color:var(--ink);padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
table.t tr.gh td .x{color:var(--ink3);font-weight:650;margin-left:8px}
table.t tr.gh td .tg{float:right;color:var(--blue);font-weight:750}
table.t tr.gh.today td{background:#eaf1fe}
.ck{width:20px;height:20px;border-radius:6px;border:2px solid #c9d2e3;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;cursor:pointer}
.ck.on{background:var(--green);border-color:var(--green)}
.empty{padding:14px 12px;color:var(--ink3);font-size:12.5px;font-style:italic}
.colmenu{position:absolute;right:0;top:38px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(3,10,30,.18);padding:8px;z-index:30;width:220px;display:none}
.colmenu.open{display:block}
.colmenu label{display:flex;gap:8px;align-items:center;padding:6px 8px;font-size:13px;font-weight:600;border-radius:7px;cursor:pointer}.colmenu label:hover{background:var(--soft)}
.colmenu .h{font-size:11px;font-weight:800;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px}
/* ===== PIPELINE ===== */
.picker{display:flex;align-items:center;gap:8px;padding:12px 14px;flex-wrap:wrap;margin-bottom:14px}
.pl{height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;padding:0 12px;font-size:13px;font-weight:700;color:var(--ink);display:inline-flex;gap:8px;align-items:center}
.pl b{font-size:11px;background:var(--soft);border-radius:999px;padding:1px 7px;color:var(--ink2)}
.pl.on{background:var(--ink);color:#fff;border-color:var(--ink)}.pl.on b{background:rgba(255,255,255,.18);color:#fff}
.pl.dim{color:var(--ink3)}
.picker .ro{margin-left:auto;display:flex;gap:6px}
.board{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 18px;align-items:flex-start;min-height:420px}
.col{flex:0 0 238px;background:#f3f5fa;border-radius:12px;padding:8px;min-height:120px}
.col .chd{display:flex;align-items:center;gap:7px;padding:4px 6px 8px}
.col .chd b{font-size:13px;font-weight:800}.col .chd .c{font-size:11.5px;font-weight:800;color:var(--ink2);background:#fff;border-radius:999px;padding:1px 8px}
.col .chd .cl{margin-left:auto;font-size:11.5px;font-weight:750;color:var(--ink3);cursor:pointer;background:none;border:0;padding:2px 4px}
.col .chd .cl:hover{color:var(--blue)}
.col.drop{outline:2px dashed var(--blue);outline-offset:-2px;background:#eaf1fe}
.col.shut{flex:0 0 46px;padding:10px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.col.shut .vl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12.5px;font-weight:800;color:var(--ink2);white-space:nowrap}
.col.shut .c{font-size:11px;font-weight:800;background:#fff;border-radius:999px;padding:1px 7px;color:var(--ink2)}
.col.shut:hover{background:#e9eef8}
.cd{background:#fff;border-radius:10px;padding:10px 11px;margin-bottom:7px;box-shadow:0 1px 2px rgba(16,26,51,.08);cursor:grab;border:1px solid transparent}
.cd:hover{border-color:#cfdcfb}
.cd b{display:block;font-size:13px;font-weight:750;line-height:1.3}
.cd span{display:block;font-size:11.5px;color:var(--ink3);font-weight:600;margin-top:3px}
.cd .dy{display:inline-block;margin-top:6px}
.cd.sent b{color:var(--ink2)}
.colempty{font-size:12px;color:var(--ink3);font-style:italic;padding:10px 6px}
.more{font-size:12px;font-weight:750;color:var(--blue);padding:4px 6px;cursor:pointer}
/* ===== SPACE DRAWER ===== */
.scrim{position:fixed;inset:0;background:rgba(5,10,28,.45);z-index:40;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,96vw);background:#f4f6fb;z-index:41;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dtop{display:flex;align-items:center;gap:8px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)}
.dtop .bc{font-size:12.5px;font-weight:700;color:var(--ink3)}.dtop .bc b{color:var(--ink)}
.dtop .r{margin-left:auto;display:flex;gap:6px}
.dbody{overflow:auto;padding:16px 18px 110px;display:flex;flex-direction:column;gap:12px}
.hero{background:linear-gradient(140deg,#1a3a8f,#2e6bf2);color:#fff;border-radius:16px;padding:18px 20px;display:flex;gap:16px;align-items:flex-start}
.hero .av{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:850;flex:none}
.hero h2{margin:6px 0 4px;font-size:24px;font-weight:850;letter-spacing:-.02em}
.hero .who{font-size:13.5px;font-weight:600;color:#dfe8ff}
.hero .tags{display:flex;gap:6px;flex-wrap:wrap}
.hero .tags .pill{background:rgba(255,255,255,.16);color:#fff}
.hero .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hero .links a{font-size:12px;font-weight:750;color:#fff;background:rgba(255,255,255,.14);border-radius:8px;padding:4px 9px;text-decoration:none}
.ready{margin-left:auto;background:rgba(5,12,40,.28);border-radius:12px;padding:10px 12px;min-width:170px;flex:none}
.ready b{font-size:20px;font-weight:850}.ready small{display:block;font-size:11.5px;color:#cbd7f7;font-weight:700;margin-bottom:6px}
.ready div{font-size:12px;font-weight:650;color:#dfe8ff;padding:2px 0}.ready div.y{color:#7ee2b4}
.box{background:#fff;border-radius:14px;padding:14px 16px}
.box h4{margin:0 0 10px;font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.box h4 .s{margin-left:auto;font-size:11.5px;color:var(--ink3);font-weight:650}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.facts div small{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:800}
.facts div span{font-size:13px;font-weight:650;color:var(--ink);line-height:1.35;word-break:break-word}
.angle{font-size:14px;line-height:1.55;color:var(--ink)}
.watch{background:var(--amber50);color:#7a5200;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:650;line-height:1.45;margin-top:10px}
.qs{margin:0;padding-left:18px;font-size:13px;line-height:1.5;color:var(--ink2)}.qs li{margin-bottom:5px}
.em label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:800;margin:8px 0 4px}
.em input,.em textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:13.5px;color:var(--ink);background:#fbfcfe}
.em textarea{min-height:270px;line-height:1.55;resize:vertical}
.route{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:650;color:var(--ink2);background:var(--soft);border-radius:9px;padding:8px 11px}
.dfoot{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;align-items:center}
.dfoot .msg{font-size:12.5px;color:var(--ink2);font-weight:650;margin-right:auto;line-height:1.35}
.dfoot .msg b{color:var(--green)}
.stsel{height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:12px;font-weight:750;padding:0 8px}
.stsel option{color:var(--ink)}
.log{font-size:12.5px;color:var(--ink2)}.log div{padding:5px 0;border-bottom:1px solid #f0f2f7}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#101a33;color:#fff;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:650;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast b{color:#8fb4ff;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(5,10,28,.5);z-index:70;display:none;align-items:center;justify-content:center}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:16px;width:440px;padding:18px 20px}
.mbox h3{margin:0 0 6px;font-size:16px;font-weight:850}
.mbox p{margin:0 0 12px;font-size:13px;color:var(--ink2);line-height:1.5}
.mbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.mbox input,.mbox select{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font:inherit;font-size:13.5px;margin-bottom:8px}
</style><style>
.doc{display:flex;flex-direction:column;height:calc(100vh - 56px - 40px - 60px)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;flex-wrap:wrap}
.dh h2{margin:0;font-size:17px;font-weight:850}
.dh .kind{font-size:11px;font-weight:800;background:#e4f6ee;color:#0e8a5f;border-radius:6px;padding:2px 7px}
.dh .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line)}
.tabs span{padding:9px 12px;font-size:12.5px;font-weight:750;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs span.on{color:var(--ink);border-color:var(--blue)}
.sttl{padding:10px 18px 4px;font-size:12.5px;color:var(--ink2);font-weight:650;line-height:1.45}
.sttl b{color:var(--ink);font-size:13.5px}
.grid{flex:1;overflow:auto;margin:6px 0 0;border-top:1px solid var(--line)}
table.sg{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
table.sg th{position:sticky;top:0;z-index:2;background:#f6f8fc;text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);font-weight:800;padding:9px 10px;border-bottom:1px solid var(--line);border-right:1px solid #eef1f6;white-space:nowrap}
table.sg td{padding:8px 10px;border-bottom:1px solid #f0f2f7;border-right:1px solid #f3f5f9;vertical-align:top;max-width:340px;line-height:1.4;color:var(--ink)}
table.sg tr:hover td{background:#f7f9fe}
table.sg td{min-width:120px}table.sg td.n{min-width:0;width:40px;color:var(--ink3)}
table.sg .key{position:sticky;left:0;background:#fff;z-index:1;font-weight:750;min-width:190px;box-shadow:2px 0 0 #eef1f6}
table.sg th.key{z-index:3;background:#f6f8fc}
table.sg td a{color:var(--blue);text-decoration:none;font-weight:650}
table.sg td.wrap{white-space:normal;min-width:220px}
.mark{background:#fff3b8;border-radius:3px}
.files{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.file{background:#fff;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:750;cursor:pointer;border:2px solid transparent}
.file.on{border-color:var(--blue)}
.file small{display:block;color:var(--ink3);font-weight:650;font-size:11.5px}
</style><style>

.dh h2{color:#fff}.dh .kind{background:#0f2e24;color:#2ee59d;box-shadow:0 0 8px rgba(46,229,157,.4)}
.tabs{border-bottom-color:#1a2450}.tabs span{color:#8fa0c8}.tabs span.on{color:#fff;border-color:#ff4d8d;text-shadow:0 0 10px rgba(255,77,141,.6)}
.sttl{color:#aebbe0}.sttl b{color:#fff}
.grid{border-top-color:#1a2450}
table.sg th{background:#0b1026;color:#7f8db5;border-bottom-color:#1a2450;border-right-color:#141c3c}
table.sg td{border-bottom-color:#141c3c;border-right-color:#101737;color:#e9eefa}
table.sg tr:hover td{background:#0f1640}
table.sg .key{background:#0b1026;box-shadow:2px 0 0 #1a2450;color:#fff}table.sg th.key{background:#0b1026}
table.sg td.n{color:#6f7fa6}
table.sg td a{color:#7fb0ff}
.mark{background:#ff4d8d;color:#fff;border-radius:3px}
.file{background:#0e1430;color:#e9eefa;border:2px solid transparent}.file.on{border-color:#ff4d8d;box-shadow:0 0 12px rgba(255,77,141,.4)}.file small{color:#8fa0c8}

let bi=0,si=0,q='';const $=s=>document.querySelector(s);

 if(q){const i=v.toLowerCase().indexOf(q);if(i>=0)t=esc(v.slice(0,i))+'<span class="mark">'+esc(v.slice(i,i+q.length))+'</span>'+esc(v.slice(i+q.length));}return t;}

 document.querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>{bi=+e.dataset.b;si=0;render();});
 $('#fname').textContent=b.name;$('#fmeta').textContent=s.rows.length+' rows · '+s.hdr.length+' columns';
 $('#tabs').innerHTML=b.sheets.map((x,i)=>'<span class="'+(i==si?'on':'')+'" data-s="'+i+'">'+x.name+'</span>').join('');
 document.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{si=+e.dataset.s;render();});
 $('#sttl').innerHTML=s.title.filter(Boolean).map((t,i)=>i==0?'<b>'+esc(t)+'</b>':esc(t)).join('<br>');
 let rows=s.rows;if(q)rows=rows.filter(r=>r.some(c=>c.toLowerCase().includes(q)));
 const wide=s.hdr.map((h,i)=>s.rows.some(r=>(r[i]||'').length>60));let key=s.hdr.findIndex(h=>/^(Fund|Company|Name|Reference)/i.test(h));if(key<0)key=0;
 $('#sg').innerHTML='<tr>'+s.hdr.map((h,i)=>'<th'+(i==key?' class="key"':'')+'>'+esc(h)+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map((c,i)=>'<td class="'+(i==key?'key ':'')+(wide[i]?'wrap ':'')+(/^(#|Rank|Tier)$/.test(s.hdr[i])?'n':'')+'">'+cellH(c)+'</td>').join('')+'</tr>').join('');
